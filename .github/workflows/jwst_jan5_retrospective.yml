name: JWST Jan-5 Retrospective Evidence Acquisition

on:
  workflow_dispatch:
  push:
    branches:
      - audit/jwst-jan5-retrospective-v1
    paths:
      - "experiments/jwst_jan5_retrospective/acquire.py"
      - "docs/JWST_JAN5_RETROSPECTIVE_PROTOCOL.md"
      - ".github/workflows/jwst_jan5_retrospective.yml"

permissions:
  contents: read

concurrency:
  group: jwst-jan5-retrospective-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    name: Acquire official JWST and heliospheric evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned NVCPP dependencies
        run: python -m pip install -r requirements.txt

      - name: Run evidence-only acquisition
        id: acquisition
        continue-on-error: true
        run: |
          python experiments/jwst_jan5_retrospective/acquire.py \
            --outdir runs/jwst_jan5_retrospective

      - name: Show bounded acquisition status
        if: always()
        run: |
          find runs/jwst_jan5_retrospective -maxdepth 4 -type f | sort || true
          echo
          cat runs/jwst_jan5_retrospective/reports/acquisition_status.md || true

      - name: Upload evidence package even when a source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jwst-jan5-retrospective-${{ github.run_id }}
          path: runs/jwst_jan5_retrospective/**
          if-no-files-found: error
          retention-days: 90

      - name: Preserve source-failure visibility
        if: always() && steps.acquisition.outcome != 'success'
        run: |
          echo "Acquisition was partial. The evidence package was preserved."
          exit 1
