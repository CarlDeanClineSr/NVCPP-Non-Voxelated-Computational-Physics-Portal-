name: NVCPP Drive Vault Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvcpp-drive-vault-preflight
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  NVCPP_GOOGLE_AUTH_B64: ${{ secrets.NVCPP_GOOGLE_AUTH_B64 }}
  NVCPP_DRIVE_PARENT_FOLDER_ID: ${{ secrets.NVCPP_DRIVE_PARENT_FOLDER_ID }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out NVCPP
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Test credential refresh and destination permissions without writing
        id: preflight
        shell: bash
        run: |
          set +e
          python -m pipelines.drive_preflight \
            --output drive_preflight_result.json \
            2>&1 | tee drive_preflight.log
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvcpp-drive-preflight-${{ github.run_id }}
          path: |
            drive_preflight_result.json
            drive_preflight.log
          if-no-files-found: error
          retention-days: 30

      - name: Write preflight summary
        if: always()
        run: |
          echo "## NVCPP Drive Vault Preflight" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat drive_preflight_result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce preflight result
        if: always()
        env:
          PREFLIGHT_EXIT_CODE: ${{ steps.preflight.outputs.exit_code }}
        run: |
          if [[ "$PREFLIGHT_EXIT_CODE" != "0" ]]; then
            echo "Drive credential or destination preflight failed. Replace the credential bundle; do not edit the observatory physics or tests."
            exit 1
          fi
