name: Finalize independent MAG control interval selection

on:
  push:
    branches:
      - feature/gate-control-harness-v1
    paths:
      - ".github/workflows/finalize_control_interval_selection.yml"

permissions:
  contents: write

concurrency:
  group: finalize-mag-control-selection-v1
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gate-control-harness-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test independent selector
        run: |
          python -m compileall -q \
            historical/select_mag_gate_control_intervals.py \
            tests/test_mag_gate_control_selection.py
          python -m json.tool config/mag_gate_control_selection.v1.json >/dev/null
          python -m pytest -q tests/test_mag_gate_control_selection.py

      - name: Run selection from OMNI only
        run: |
          rm -rf runs/control_selection
          python -m historical.select_mag_gate_control_intervals \
            --config config/mag_gate_control_selection.v1.json \
            --outdir runs/control_selection

      - name: Verify selection is independent and complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path("runs/control_selection")
          files = sorted(path for path in root.rglob("*") if path.is_file())
          if not files:
              raise SystemExit("selector produced no files")

          text_parts = []
          for path in files:
              if path.suffix.lower() in {".json", ".csv", ".md", ".txt"}:
                  text_parts.append(path.read_text(encoding="utf-8", errors="strict"))
          combined = "\n".join(text_parts)
          normalized = combined.upper()

          if "LOW" not in normalized or "MODERATE" not in normalized:
              raise SystemExit("selection output lacks low and moderate control classes")
          dates = sorted(set(re.findall(r"2024-\d{2}-\d{2}", combined)))
          if len(dates) < 4:
              raise SystemExit(f"selection output exposes too few independently chosen dates: {dates}")

          forbidden = [
              "DSCOVR_H0_MAG",
              "AC_H0_MFI",
              "WI_H0_MFI",
              "gate_pass",
              "rotation_from_previous",
              "magnitude_change_from_previous",
          ]
          source = Path("historical/select_mag_gate_control_intervals.py").read_text(
              encoding="utf-8"
          )
          violations = [token for token in forbidden if token in source]
          if violations:
              raise SystemExit(
                  f"control selector is contaminated by spacecraft gate outputs: {violations}"
              )

          print(json.dumps({
              "file_count": len(files),
              "observed_dates": dates,
              "gate_output_tokens_in_selector": violations,
          }, indent=2))
          PY

      - name: Freeze compact selection evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf provenance/mag_gate_control_selection_v1
          mkdir -p provenance/mag_gate_control_selection_v1
          find runs/control_selection -type f \
            ! -path '*/raw/*' \
            ! -name '*.zip' \
            -print0 | while IFS= read -r -d '' path; do
              relative="${path#runs/control_selection/}"
              mkdir -p "provenance/mag_gate_control_selection_v1/$(dirname "$relative")"
              cp "$path" "provenance/mag_gate_control_selection_v1/$relative"
            done

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path("provenance/mag_gate_control_selection_v1")
          inventory = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  payload = path.read_bytes()
                  inventory.append({
                      "path": path.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                      "size_bytes": len(payload),
                  })
          if not inventory:
              raise SystemExit("no compact selection evidence was preserved")
          (root / "FROZEN_INVENTORY.json").write_text(
              json.dumps({
                  "status": "FROZEN_BEFORE_SPACECRAFT_GATE_RETRIEVAL",
                  "selection_inputs": "NASA OMNI activity metrics and predeclared event controls only",
                  "spacecraft_gate_outputs_used": False,
                  "files": inventory,
              }, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Remove one-time repair workflows and commit selection evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/repair_control_selector_transport.yml \
            .github/workflows/repair_control_selector_hapi_time.yml \
            .github/workflows/finalize_control_interval_selection.yml
          git config user.name "NVCPP Control Selection"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: freeze independently selected MAG control intervals"
          git push origin HEAD:feature/gate-control-harness-v1
