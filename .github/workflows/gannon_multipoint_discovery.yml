name: NVCPP Gannon Multipoint Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gannon-multipoint-v1
    paths:
      - "historical/discover_gannon_multipoint.py"
      - "historical/discover_dscovr_f1m.py"
      - ".github/workflows/gannon_multipoint_discovery.yml"

permissions:
  contents: read

concurrency:
  group: nvcpp-gannon-multipoint-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile discovery probes
        run: |
          python -m compileall -q \
            historical/discover_gannon_multipoint.py \
            historical/discover_dscovr_f1m.py
      - name: Query authoritative ACE and Wind schemas and bounded samples
        run: |
          python -m historical.discover_gannon_multipoint \
            --start 2024-05-11T10:30:00Z \
            --stop 2024-05-11T11:30:00Z \
            --outdir runs/discovery/gannon_multipoint
      - name: Query current NOAA DSCOVR one-minute plasma schema
        run: |
          python -m historical.discover_dscovr_f1m \
            --start 2024-05-11T10:30:00Z \
            --stop 2024-05-11T11:30:00Z \
            --outdir runs/discovery/dscovr_f1m
      - name: Upload immutable discovery package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvcpp-gannon-multipoint-discovery
          path: runs/discovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
