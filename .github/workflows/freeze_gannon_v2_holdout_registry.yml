name: Freeze Gannon V2 Holdout Registry

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gannon-v2-frozen-registry
    paths:
      - "config/gannon_holdout_v2_selection.v1.json"
      - "historical/freeze_gannon_v2_holdout_registry.py"
      - ".github/workflows/freeze_gannon_v2_holdout_registry.yml"

permissions:
  contents: write

concurrency:
  group: freeze-gannon-v2-holdout-registry
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out registry branch
        uses: actions/checkout@v4
        with:
          ref: feature/gannon-v2-frozen-registry
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate frozen selection contract
        run: |
          python -m json.tool config/gannon_holdout_v2.preregistered.json >/dev/null
          python -m json.tool config/gannon_holdout_v2_selection.v1.json >/dev/null
          python -m compileall -q historical/freeze_gannon_v2_holdout_registry.py

      - name: Prove selector has no spacecraft-MAG execution path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("historical/freeze_gannon_v2_holdout_registry.py")
          text = path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          forbidden_imports = {
              "historical.download_dscovr_cdaweb",
              "historical.gannon_gate_density",
              "historical.gannon_multipoint_audit",
              "historical.mag_gate_control_harness",
              "historical.mag_gate_event_class_controls",
          }
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          bad = sorted(imports & forbidden_imports)
          if bad:
              raise SystemExit(f"selector imports MAG/gate code: {bad}")
          for token in ("/hapi/data", "WS/cdasr", "download_dscovr(", "gate_pass("):
              if token in text:
                  raise SystemExit(f"selector contains forbidden execution token: {token}")
          print("Selection firewall passed: independent catalog inputs only")
          PY

      - name: Refuse to overwrite an existing frozen registry
        run: |
          test ! -e config/gannon_holdout_v2.registry.json
          test ! -e provenance/gannon_holdout_v2_registry/FROZEN_INVENTORY.json

      - name: Select and freeze dates from GFZ and Richardson-Cane only
        run: |
          python -m historical.freeze_gannon_v2_holdout_registry \
            --contract config/gannon_holdout_v2_selection.v1.json \
            --outdir runs/registry/gannon_v2

      - name: Verify registry before committing it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          root = Path("runs/registry/gannon_v2")
          registry = json.loads((root / "gannon_holdout_v2.registry.json").read_text())
          if registry.get("status") != "FROZEN_BEFORE_HOLDOUT_MAG_RETRIEVAL":
              raise SystemExit("registry does not have frozen status")
          firewall = registry["selection_firewall"]
          if any(
              firewall.get(key) is not False
              for key in (
                  "spacecraft_mag_retrieved",
                  "mag_values_inspected",
                  "gate_outputs_inspected",
                  "clustering_outputs_inspected",
              )
          ):
              raise SystemExit("selection firewall was violated")
          counts = Counter(item["class"] for item in registry["intervals"])
          expected = {
              "QUIET_SOLAR_WIND": 12,
              "MODERATE_VARIABILITY": 12,
              "ISOLATED_SHOCK_OR_SHEATH": 12,
              "COMPLEX_INTERACTING_EJECTA": 12,
          }
          if dict(counts) != expected:
              raise SystemExit(f"wrong class counts: {dict(counts)}")
          ids = [item["interval_id"] for item in registry["intervals"]]
          if len(ids) != len(set(ids)):
              raise SystemExit("duplicate interval IDs")
          for item in registry["intervals"]:
              if item.get("mag_inspected_before_freeze") is not False:
                  raise SystemExit(f"MAG inspection flag changed: {item['interval_id']}")
              if item.get("replacement_after_scoring_allowed") is not False:
                  raise SystemExit(f"replacement allowed: {item['interval_id']}")
              if item.get("failure_policy") != "INCOMPLETE_MULTIPOINT_RETAIN_IN_DENOMINATOR":
                  raise SystemExit(f"failure policy drift: {item['interval_id']}")
              if not item.get("selection_rule") or not item.get("independent_evidence"):
                  raise SystemExit(f"missing evidence: {item['interval_id']}")
          hash_view = dict(registry)
          expected_hash = hash_view.pop("registry_content_sha256")
          hash_view.pop("created_utc", None)
          actual_hash = hashlib.sha256(
              json.dumps(hash_view, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          if actual_hash != expected_hash:
              raise SystemExit("registry content hash mismatch")
          print(json.dumps({"counts": expected, "sha256": expected_hash}, indent=2))
          PY

      - name: Stage compact immutable registry evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p provenance/gannon_holdout_v2_registry
          cp runs/registry/gannon_v2/gannon_holdout_v2.registry.json \
             config/gannon_holdout_v2.registry.json
          cp runs/registry/gannon_v2/gannon_holdout_v2.registry.csv \
             provenance/gannon_holdout_v2_registry/registry.csv
          cp runs/registry/gannon_v2/source_manifest.json \
             provenance/gannon_holdout_v2_registry/source_manifest.json
          cp runs/registry/gannon_v2/GANNON_V2_FROZEN_DATE_LIST.md \
             docs/GANNON_V2_FROZEN_DATE_LIST.md
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          paths = [
              Path("config/gannon_holdout_v2.registry.json"),
              Path("provenance/gannon_holdout_v2_registry/registry.csv"),
              Path("provenance/gannon_holdout_v2_registry/source_manifest.json"),
              Path("docs/GANNON_V2_FROZEN_DATE_LIST.md"),
          ]
          inventory = {
              "status": "FROZEN_BEFORE_HOLDOUT_MAG_RETRIEVAL",
              "selector_commit": os.environ.get("GITHUB_SHA"),
              "spacecraft_mag_retrieved": False,
              "gate_outputs_inspected": False,
              "clustering_outputs_inspected": False,
              "files": [
                  {
                      "path": path.as_posix(),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "size_bytes": path.stat().st_size,
                  }
                  for path in paths
              ],
          }
          Path("provenance/gannon_holdout_v2_registry/FROZEN_INVENTORY.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Add immutable registry integrity test
        shell: bash
        run: |
          cat > tests/test_gannon_holdout_v2_registry.py <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          REGISTRY = Path("config/gannon_holdout_v2.registry.json")
          INVENTORY = Path("provenance/gannon_holdout_v2_registry/FROZEN_INVENTORY.json")


          def load_registry():
              return json.loads(REGISTRY.read_text(encoding="utf-8"))


          def test_v2_registry_is_frozen_before_mag():
              data = load_registry()
              assert data["status"] == "FROZEN_BEFORE_HOLDOUT_MAG_RETRIEVAL"
              assert data["selection_firewall"] == {
                  "allowed_inputs": ["GFZ_KP", "RICHARDSON_CANE_ICME"],
                  "clustering_outputs_inspected": False,
                  "gate_outputs_inspected": False,
                  "mag_values_inspected": False,
                  "spacecraft_mag_retrieved": False,
              }


          def test_v2_registry_has_twelve_per_class_and_no_duplicates():
              data = load_registry()
              counts = Counter(item["class"] for item in data["intervals"])
              assert counts == {
                  "QUIET_SOLAR_WIND": 12,
                  "MODERATE_VARIABILITY": 12,
                  "ISOLATED_SHOCK_OR_SHEATH": 12,
                  "COMPLEX_INTERACTING_EJECTA": 12,
              }
              ids = [item["interval_id"] for item in data["intervals"]]
              assert len(ids) == len(set(ids)) == 48


          def test_v2_registry_keeps_failures_in_denominator():
              data = load_registry()
              policy = data["future_evaluation_policy"]
              assert policy["registered_denominator_is_immutable"] is True
              assert policy["failed_fetch_state"] == "INCOMPLETE_MULTIPOINT"
              assert policy["substitution_after_mag_or_gate_inspection_allowed"] is False
              for item in data["intervals"]:
                  assert item["failure_policy"] == "INCOMPLETE_MULTIPOINT_RETAIN_IN_DENOMINATOR"
                  assert item["replacement_after_scoring_allowed"] is False
                  assert item["mission_era_tag"]


          def test_v2_registry_content_hash_is_reproducible():
              data = load_registry()
              expected = data.pop("registry_content_sha256")
              data.pop("created_utc", None)
              actual = hashlib.sha256(
                  json.dumps(data, sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest()
              assert actual == expected


          def test_v2_inventory_hashes_all_committed_registry_files():
              inventory = json.loads(INVENTORY.read_text(encoding="utf-8"))
              assert inventory["spacecraft_mag_retrieved"] is False
              assert inventory["gate_outputs_inspected"] is False
              for item in inventory["files"]:
                  path = Path(item["path"])
                  assert path.is_file()
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]
          PY

      - name: Test the committed form before publication
        run: |
          python -m pytest -q \
            tests/test_gannon_holdout_v2_preregistration.py \
            tests/test_gannon_holdout_v2_registry.py

      - name: Commit the frozen date list
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NVCPP Holdout Registry Freezer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            config/gannon_holdout_v2.registry.json \
            provenance/gannon_holdout_v2_registry \
            docs/GANNON_V2_FROZEN_DATE_LIST.md \
            tests/test_gannon_holdout_v2_registry.py
          git commit -m "science: freeze Gannon V2 prospective holdout date list"
          git push origin HEAD:feature/gannon-v2-frozen-registry

      - name: Upload source and registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvcpp-gannon-v2-holdout-registry-source-evidence
          path: runs/registry/gannon_v2
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
