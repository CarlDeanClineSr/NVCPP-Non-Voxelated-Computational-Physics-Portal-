name: Gannon V2 Catalog-Only Holdout Registry Selection

# Registry selector v1.0.0: independent catalogs only; no spacecraft MAG.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/gannon-v2-holdout-registry
    paths:
      - "config/gannon_holdout_v2_selection.v1.json"
      - "historical/select_gannon_v2_holdout_registry.py"
      - "tests/test_gannon_v2_holdout_registry_selection.py"
      - ".github/workflows/gannon_v2_holdout_registry_selection.yml"
  pull_request:
    paths:
      - "config/gannon_holdout_v2_selection.v1.json"
      - "historical/select_gannon_v2_holdout_registry.py"
      - "tests/test_gannon_v2_holdout_registry_selection.py"
      - "provenance/gannon_v2_holdout_registry/**"
      - ".github/workflows/gannon_v2_holdout_registry_selection.yml"

permissions:
  contents: read

concurrency:
  group: gannon-v2-holdout-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies and HTML parser
        run: python -m pip install -r requirements.txt lxml==6.0.1

      - name: Compile and run catalog-only invariants
        run: |
          python -m compileall -q \
            historical/select_gannon_v2_holdout_registry.py \
            tests/test_gannon_v2_holdout_registry_selection.py
          python -m json.tool config/gannon_holdout_v2_selection.v1.json >/dev/null
          python -m json.tool config/gannon_holdout_v2.preregistered.json >/dev/null
          python -m pytest -q tests/test_gannon_v2_holdout_registry_selection.py

      - name: Generate prospective registry without spacecraft MAG
        run: |
          python -m historical.select_gannon_v2_holdout_registry \
            --config config/gannon_holdout_v2_selection.v1.json \
            --preregistration config/gannon_holdout_v2.preregistered.json \
            --outdir runs/holdout/gannon_v2_registry_selection

      - name: Enforce frozen date-list boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path("runs/holdout/gannon_v2_registry_selection")
          registry = json.loads((root / "gannon_v2_holdout_registry.v1.json").read_text())
          manifest = json.loads((root / "selection_manifest.json").read_text())

          expected_classes = {
              "QUIET_SOLAR_WIND",
              "MODERATE_VARIABILITY",
              "ISOLATED_SHOCK_OR_SHEATH",
              "COMPLEX_INTERACTING_EJECTA",
          }
          if registry.get("status") != "FROZEN_BEFORE_HOLDOUT_MAG_RETRIEVAL":
              raise SystemExit("registry is not frozen before MAG retrieval")
          if manifest.get("status") != "SUCCESS":
              raise SystemExit(f"selection status is {manifest.get('status')!r}")
          if manifest.get("spacecraft_mag_retrieved") is not False:
              raise SystemExit("selector retrieved spacecraft MAG")
          if manifest.get("physics_computed") is not False:
              raise SystemExit("selector computed physics")
          if manifest.get("geometry_opened") is not False:
              raise SystemExit("selector opened geometry")

          intervals = registry.get("intervals", [])
          counts = Counter(item["class"] for item in intervals)
          if len(intervals) != 40:
              raise SystemExit(f"expected 40 frozen intervals, got {len(intervals)}")
          if set(counts) != expected_classes:
              raise SystemExit(f"unexpected class set: {set(counts)}")
          if any(counts[name] != 10 for name in expected_classes):
              raise SystemExit(f"class counts are not 10 each: {dict(counts)}")
          ids = [item["interval_id"] for item in intervals]
          if len(ids) != len(set(ids)):
              raise SystemExit("interval IDs are not unique")

          required_item_keys = {
              "interval_id",
              "class",
              "start_utc",
              "stop_utc",
              "mission_era",
              "selection_rule",
              "independent_selection_evidence",
              "spacecraft_mag_retrieved_before_freeze",
              "gate_outputs_inspected_before_freeze",
              "candidate_scores_inspected_before_freeze",
              "replacement_after_later_failure_allowed",
              "initial_retrieval_state",
          }
          for item in intervals:
              missing = required_item_keys - set(item)
              if missing:
                  raise SystemExit(f"{item.get('interval_id')} lacks {sorted(missing)}")
              if item["start_utc"].startswith("2024-"):
                  raise SystemExit(f"V1 year leaked into V2: {item['interval_id']}")
              if item["spacecraft_mag_retrieved_before_freeze"] is not False:
                  raise SystemExit("MAG firewall failed")
              if item["gate_outputs_inspected_before_freeze"] is not False:
                  raise SystemExit("gate-output firewall failed")
              if item["candidate_scores_inspected_before_freeze"] is not False:
                  raise SystemExit("candidate-score firewall failed")
              if item["replacement_after_later_failure_allowed"] is not False:
                  raise SystemExit("replacement policy drifted")
              if item["initial_retrieval_state"] != "NOT_ATTEMPTED_REGISTRY_ONLY":
                  raise SystemExit("retrieval was attempted before freeze")
              if not item["independent_selection_evidence"].get("source"):
                  raise SystemExit(f"{item['interval_id']} lacks source evidence")

          eras = Counter(item["mission_era"] for item in intervals)
          if len(eras) < 3:
              raise SystemExit(f"registry does not span all declared eras: {dict(eras)}")
          if registry.get("physical_interpretation_reopened") is not False:
              raise SystemExit("10:59 interpretation was reopened")
          if registry.get("geometry_state") != "CLOSED":
              raise SystemExit("geometry was opened")
          print(json.dumps({
              "registry_sha256": manifest["registry_sha256"],
              "class_counts": dict(counts),
              "mission_era_counts": dict(eras),
              "interval_ids": ids,
          }, indent=2))
          PY

      - name: Prove workflow contains no spacecraft MAG retrieval command
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("historical/select_gannon_v2_holdout_registry.py"),
              Path(".github/workflows/gannon_v2_holdout_registry_selection.yml"),
          ]
          forbidden = (
              "historical.download_dscovr",
              "historical.gannon_gate_density",
              "historical.gannon_multipoint_audit",
              "DSCOVR_H0_MAG_raw_bytes",
              "AC_H0_MFI",
              "WI_H0_MFI",
              "cdaweb.gsfc.nasa.gov/hapi/data",
              "cdaweb.gsfc.nasa.gov/WS/cdasr",
          )
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f"forbidden MAG retrieval token {token!r} in {path}")
          print("Catalog-only registry selection confirmed")
          PY

      - name: Upload immutable catalog-selection package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvcpp-gannon-v2-holdout-registry-selection
          path: runs/holdout/gannon_v2_registry_selection
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
