name: NVCPP CI

on:
  pull_request:
  push:
    paths:
      - "core/**"
      - "historical/**"
      - "sources/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: nvcpp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q core historical sources tests
      - name: Validate authoritative SOLAR-1 contract
        run: python -m sources.solar1.validate_contract config/solar1_mag_contract.v1.json
      - name: Test
        run: python -m pytest -q
