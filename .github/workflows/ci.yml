name: NVCPP CI

on:
  pull_request:
  push:
    paths:
      - "**/*.py"
      - ".github/workflows/**"
      - "config/**"
      - "requirements.txt"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: nvcpp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: NVCPP CI / audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q core historical observatory pipelines sources tests tools
      - name: Scan repository for credential material and obsolete OAuth paths
        run: python tools/repository_security_scan.py
      - name: Validate authoritative SOLAR-1 contract
        run: python -m sources.solar1.validate_contract config/solar1_mag_contract.v1.json
      - name: Validate hourly observatory configuration
        run: python -m json.tool config/hourly_observatory.v1.json >/dev/null
      - name: Validate Roman prelaunch readiness contract
        run: |
          python -m json.tool config/roman_prelaunch.v1.json >/dev/null
          python -c "from pathlib import Path; from observatory.roman.contracts import load_contract; load_contract(Path('config/roman_prelaunch.v1.json'))"
      - name: Test
        run: python -m pytest -q
