name: Repair Gannon V2 registry timestamp handling

on:
  push:
    branches:
      - feature/gannon-v2-holdout-registry
    paths:
      - ".github/workflows/repair_gannon_v2_registry_selector.yml"

permissions:
  contents: write

concurrency:
  group: repair-gannon-v2-registry-selector
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gannon-v2-holdout-registry
          fetch-depth: 0

      - name: Replace unit-sensitive timestamp integer reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("historical/select_gannon_v2_holdout_registry.py")
          text = path.read_text(encoding="utf-8")
          old = '''        integer_times = group["time"].astype("int64").to_numpy()
          reference = pd.Timestamp(int(np.median(integer_times)), tz="UTC")'''
          new = '''        first_time = group["time"].min()
          last_time = group["time"].max()
          reference = first_time + (last_time - first_time) / 2'''
          if text.count(old) != 1:
              raise SystemExit(
                  "expected exactly one unit-sensitive IPShocks timestamp block"
              )
          path.write_text(text.replace(old, new), encoding="utf-8")
          print(
              "Replaced integer timestamp reconstruction with timezone-aware midpoint"
          )
          PY

      - name: Install dependencies and run focused invariants
        run: |
          python -m pip install -r requirements.txt lxml==6.0.1
          python -m compileall -q \
            historical/select_gannon_v2_holdout_registry.py \
            tests/test_gannon_v2_holdout_registry_selection.py
          python -m pytest -q tests/test_gannon_v2_holdout_registry_selection.py

      - name: Commit parser correction and remove one-time repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NVCPP Registry Repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/repair_gannon_v2_registry_selector.yml
          git add historical/select_gannon_v2_holdout_registry.py
          git commit -m "repair: preserve IPShocks timestamp resolution"
          git push origin HEAD:feature/gannon-v2-holdout-registry
