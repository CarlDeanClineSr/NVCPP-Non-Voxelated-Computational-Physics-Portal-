name: Patch Gannon V2 source-magnitude provenance

on:
  push:
    branches:
      - hardening/gannon-v2-source-magnitude-provenance
    paths:
      - ".github/workflows/patch_gannon_v2_magnitude_provenance.yml"

permissions:
  contents: write

concurrency:
  group: patch-gannon-v2-magnitude-provenance
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/gannon-v2-source-magnitude-provenance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Add explicit nonhomologous source provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("historical/gannon_holdout_v2_consumer.py")
          text = source_path.read_text(encoding="utf-8")
          original = text

          text = text.replace(
              'CONSUMER_VERSION = "1.0.0"',
              'CONSUMER_VERSION = "1.0.1"',
              1,
          )

          anchor = '''def _iso(value: pd.Timestamp) -> str:
              return value.isoformat().replace("+00:00", "Z")


          def _slice_analysis'''.replace("          ", "")
          helper = '''def _iso(value: pd.Timestamp) -> str:
              return value.isoformat().replace("+00:00", "Z")


          def canonical_magnitude_provenance(mission: str) -> dict[str, Any]:
              """Describe exactly how canonical |B| is constructed for one source."""

              records: dict[str, dict[str, Any]] = {
                  "DSCOVR": {
                      "dataset_id": "DSCOVR_H0_MAG",
                      "component_source": "B1GSE",
                      "component_columns": [
                          "resolved B1GSE Bx GSE component",
                          "resolved B1GSE By GSE component",
                          "resolved B1GSE Bz GSE component",
                      ],
                      "provider_reported_magnitude_parameter": None,
                      "provider_reported_magnitude_role": "NOT_PRESENT_IN_REQUEST",
                  },
                  "ACE": {
                      "dataset_id": "AC_H0_MFI",
                      "component_source": "BGSEc",
                      "component_columns": ["BGSEc_x", "BGSEc_y", "BGSEc_z"],
                      "provider_reported_magnitude_parameter": "Magnitude",
                      "provider_reported_magnitude_role": "AUDIT_ONLY",
                  },
                  "WIND": {
                      "dataset_id": "WI_H0_MFI",
                      "component_source": "B3GSE",
                      "component_columns": ["B3GSE_x", "B3GSE_y", "B3GSE_z"],
                      "provider_reported_magnitude_parameter": "B3F1",
                      "provider_reported_magnitude_role": "AUDIT_ONLY",
                  },
              }
              if mission not in records:
                  raise HoldoutConsumerError(
                      f"unsupported canonical magnitude provenance mission: {mission}"
                  )
              return {
                  **records[mission],
                  "coordinate_frame": "GSE",
                  "canonical_quantity": "B_mag_nT",
                  "provider_reported_magnitude_used_for_canonical_B": False,
                  "operation_order": [
                      "average native vector components within each canonical UTC minute",
                      "calculate Euclidean norm from the three component means",
                  ],
                  "formula": (
                      "B_mag_nT = sqrt(mean(Bx_GSE)^2 + mean(By_GSE)^2 + "
                      "mean(Bz_GSE)^2)"
                  ),
                  "nonhomologous_source_warning": (
                      "provider scalar magnitude fields are retained only for source audit; "
                      "they are not averaged into or substituted for canonical B_mag_nT"
                  ),
              }


          def _slice_analysis'''.replace("          ", "")
          if anchor not in text:
              raise SystemExit("could not locate _iso insertion anchor")
          text = text.replace(anchor, helper, 1)

          dscovr_old = '''        "coordinate_frame": "GSE",
                  "canonicalization": metrics,
              }
              return standardized, quarantine, metadata'''.replace("              ", "")
          dscovr_new = '''        "coordinate_frame": "GSE",
                  "canonicalization": metrics,
                  "canonical_magnitude_provenance": canonical_magnitude_provenance(
                      "DSCOVR"
                  ),
              }
              return standardized, quarantine, metadata'''.replace("              ", "")
          if dscovr_old not in text:
              raise SystemExit("could not locate DSCOVR metadata anchor")
          text = text.replace(dscovr_old, dscovr_new, 1)

          def inject_metadata(
              value: str,
              *,
              function_name: str,
              next_function_name: str,
              mission: str,
          ) -> str:
              start = value.index(f"def {function_name}(")
              stop = value.index(f"\ndef {next_function_name}(", start)
              block = value[start:stop]
              old = "    return _slice_analysis(canonical, window), quarantine, metadata\n"
              if old not in block:
                  raise SystemExit(f"could not locate return anchor in {function_name}")
              new = (
                  f'    metadata = {{\n'
                  f'        **metadata,\n'
                  f'        "canonical_magnitude_provenance": '\
                  f'canonical_magnitude_provenance("{mission}"),\n'
                  f'    }}\n'
                  f'    return _slice_analysis(canonical, window), quarantine, metadata\n'
              )
              block = block.replace(old, new, 1)
              return value[:start] + block + value[stop:]

          text = inject_metadata(
              text,
              function_name="retrieve_ace",
              next_function_name="retrieve_wind",
              mission="ACE",
          )
          text = inject_metadata(
              text,
              function_name="retrieve_wind",
              next_function_name="minute_arrays",
              mission="WIND",
          )

          manifest_old = '''        "primary_clustering_hypothesis": contract[
                  "primary_clustering_hypothesis"
              ],
              "source_status": {},'''.replace("              ", "")
          manifest_new = '''        "primary_clustering_hypothesis": contract[
                  "primary_clustering_hypothesis"
              ],
              "source_products": contract["source_products"],
              "canonical_magnitude_provenance": {
                  mission: canonical_magnitude_provenance(mission)
                  for mission in ("DSCOVR", "ACE", "WIND")
              },
              "source_status": {},'''.replace("              ", "")
          if manifest_old not in text:
              raise SystemExit("could not locate interval-manifest provenance anchor")
          text = text.replace(manifest_old, manifest_new, 1)

          if text == original:
              raise SystemExit("source patch produced no changes")
          source_path.write_text(text, encoding="utf-8")

          docs_path = Path("docs/GANNON_V2_IMMUTABLE_CONSUMER.md")
          docs = docs_path.read_text(encoding="utf-8")
          marker = "## Canonical magnitude provenance"
          if marker not in docs:
              docs += '''

          ## Canonical magnitude provenance

          The three source products are not treated as homologous scalar-magnitude
          products. Every interval manifest names the vector used to build canonical
          `B_mag_nT` and the role of any provider-supplied scalar magnitude:

          - DSCOVR: average the three `B1GSE` Cartesian components by minute, then
            calculate their Euclidean norm.
          - ACE: average `BGSEc_x`, `BGSEc_y`, and `BGSEc_z` by minute, then calculate
            their Euclidean norm. The requested `Magnitude` parameter is audit-only and
            is never averaged into canonical `B_mag_nT`.
          - Wind: average `B3GSE_x`, `B3GSE_y`, and `B3GSE_z` by minute, then calculate
            their Euclidean norm. `B3F1` is audit-only and is never treated as a vector
            component or substituted for canonical `B_mag_nT`.

          This provenance is repeated both at interval-manifest level and inside each
          retrieved source metadata record. The provider scalar values remain preserved
          in raw responses but do not enter the frozen detector.
          '''.replace("          ", "")
              docs_path.write_text(docs, encoding="utf-8")
          PY

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test provenance boundary
        run: |
          python -m compileall -q historical tests
          python -m pytest -q \
            tests/test_gannon_holdout_v2_consumer.py \
            tests/test_gannon_holdout_v2_source_provenance.py

      - name: Commit provenance-only hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NVCPP Provenance Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add \
            historical/gannon_holdout_v2_consumer.py \
            docs/GANNON_V2_IMMUTABLE_CONSUMER.md
          if git diff --cached --quiet; then
            echo "No provenance patch required"
            exit 0
          fi
          git commit -m "audit: make ACE and Wind magnitude roles explicit"
          git push origin HEAD:hardening/gannon-v2-source-magnitude-provenance
