name: Repair control-selector NASA HAPI transport

on:
  push:
    branches:
      - feature/gate-control-harness-v1
    paths:
      - ".github/workflows/repair_control_selector_hapi_time.yml"

permissions:
  contents: write

concurrency:
  group: repair-control-selector-hapi-time
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gate-control-harness-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Normalize NASA CDAWeb HAPI request semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("historical/select_mag_gate_control_intervals.py")
          text = path.read_text(encoding="utf-8")
          original = text

          # NASA CDAWeb HAPI uses the HAPI-standard keys `id`, `time.min`, and
          # `time.max`.  NOAA/NCEI's separate HAPI gateway uses dataset/start/stop.
          # This selector talks to NASA CDAWeb and must not mix those contracts.
          replacements = [
              (r'(["\'])dataset\1\s*:\s*OMNI_DATASET_ID', '"id": OMNI_DATASET_ID'),
              (r'(["\'])dataset\1\s*:\s*dataset_id', '"id": dataset_id'),
              (r'(["\'])start\1\s*:\s*start', '"time.min": start'),
              (r'(["\'])stop\1\s*:\s*stop', '"time.max": stop'),
              (r'(["\'])start\1\s*:\s*chunk_start', '"time.min": chunk_start'),
              (r'(["\'])stop\1\s*:\s*chunk_stop', '"time.max": chunk_stop'),
          ]
          counts = {}
          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text)
              counts[pattern] = count

          # Fail closed if the source still contains NASA /hapi/data requests
          # with NOAA-style temporal keys.
          if 'cdaweb.gsfc.nasa.gov/hapi' not in text:
              raise SystemExit("selector no longer identifies the NASA CDAWeb HAPI endpoint")
          suspicious = re.findall(r'["\'](?:start|stop|dataset)["\']\s*:', text)
          if suspicious:
              raise SystemExit(f"NASA selector still contains NOAA-style HAPI keys: {suspicious}")
          for required in ('"id"', '"time.min"', '"time.max"'):
              if required not in text:
                  raise SystemExit(f"selector lacks required NASA HAPI key {required}")

          if text == original:
              print("Selector already uses NASA HAPI-standard time semantics")
          else:
              path.write_text(text, encoding="utf-8")
              print(f"Normalized NASA HAPI keys: {counts}")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and run focused tests
        run: |
          python -m compileall -q \
            historical/select_mag_gate_control_intervals.py \
            tests/test_mag_gate_control_selection.py
          python -m json.tool config/mag_gate_control_selection.v1.json >/dev/null
          python -m pytest -q tests/test_mag_gate_control_selection.py

      - name: Probe one complete OMNI day
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from historical.select_mag_gate_control_intervals import load_contract, fetch_omni_pool

          contract = load_contract(Path("config/mag_gate_control_selection.v1.json"))
          with tempfile.TemporaryDirectory() as temp:
              frame, metadata = fetch_omni_pool(
                  contract=contract,
                  start="2024-01-10T00:00:00Z",
                  stop="2024-01-11T00:00:00Z",
                  outdir=Path(temp),
              )
          if len(frame) < 1300:
              raise SystemExit(
                  f"NASA OMNI one-day probe returned only {len(frame)} rows; expected minute-scale data"
              )
          if frame["time"].duplicated().any():
              raise SystemExit("NASA OMNI one-day probe contains duplicate timestamps")
          print(json.dumps({"rows": len(frame), "metadata": metadata}, default=str)[:4000])
          PY

      - name: Commit source repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- historical/select_mag_gate_control_intervals.py; then
            echo "No source repair commit required"
            exit 0
          fi
          git config user.name "NVCPP Audit Repair"
          git config user.email "actions@users.noreply.github.com"
          git add historical/select_mag_gate_control_intervals.py
          git commit -m "repair: use NASA HAPI-standard time parameters for OMNI selection"
          git push origin HEAD:feature/gate-control-harness-v1
