name: Repair Gannon V2 catalog coverage boundary

on:
  push:
    branches:
      - feature/gannon-v2-holdout-registry
    paths:
      - ".github/workflows/repair_gannon_v2_catalog_coverage.yml"

permissions:
  contents: write

concurrency:
  group: repair-gannon-v2-catalog-coverage
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gannon-v2-holdout-registry
          fetch-depth: 0

      - name: Bound the late mission era to independent catalog coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          cutoff = "2026-07-01T00:00:00Z"
          config_path = Path("config/gannon_holdout_v2_selection.v1.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))

          late = [
              era for era in config["mission_eras"]
              if era["id"] == "ERA_DSCOVR_ACE_WIND_LATE_2025_2026"
          ]
          if len(late) != 1:
              raise SystemExit(f"expected one late mission era; found {len(late)}")
          late[0]["stop_utc"] = cutoff
          late[0]["availability_warning"] = (
              "The prospective registry is frozen only through 2026-06-30, inside "
              "the independent event-catalog coverage available at selection time. "
              "Actual MAG availability is tested later; a missing mission becomes "
              "INCOMPLETE_MULTIPOINT or ERA_ACE_UNAVAILABLE."
          )

          rules = config["global_rules"]
          rules["catalog_coverage_stop_utc_exclusive"] = cutoff
          rules["catalog_coverage_policy"] = (
              "Every selected interval reference/start must precede 2026-07-01T00:00:00Z. "
              "A missing catalog event after the source coverage boundary is not evidence "
              "of an event-free quiet or moderate day."
          )

          amendments = config.setdefault("catalog_feasibility_amendments", [])
          amendments = [
              item for item in amendments
              if item.get("amendment_id") != "CATALOG_COVERAGE_002"
          ]
          amendments.append(
              {
                  "amendment_id": "CATALOG_COVERAGE_002",
                  "state_when_applied": "BEFORE_FINAL_REGISTRY_FREEZE_AND_BEFORE_ANY_SPACECRAFT_MAG_RETRIEVAL",
                  "independent_catalog_observation": (
                      "The first catalog-only candidate list could select a GFZ Kp day "
                      "after the independent Richardson-Cane event catalog coverage. "
                      "Absence of a catalog event outside source coverage cannot support "
                      "an event-free classification."
                  ),
                  "change": (
                      "End the late 2025-2026 mission era at the exclusive cutoff "
                      "2026-07-01T00:00:00Z."
                  ),
                  "total_class_target_changed": False,
                  "class_era_targets_changed": False,
                  "detector_changed": False,
                  "primary_clustering_hypothesis_changed": False,
                  "timing_radii_changed": False,
                  "magnetic_data_inspected": False,
                  "gate_outputs_inspected": False,
                  "candidate_scores_inspected": False,
              }
          )
          config["catalog_feasibility_amendments"] = amendments
          config["selection_contract_version"] = "1.0.2-catalog-coverage"
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")

          test_path = Path("tests/test_gannon_v2_holdout_registry_selection.py")
          text = test_path.read_text(encoding="utf-8")
          marker = '    assert selection["global_rules"]["excluded_years"] == [2024]\n'
          additions = (
              marker
              + '    assert selection["global_rules"]["catalog_coverage_stop_utc_exclusive"] == "2026-07-01T00:00:00Z"\n'
              + '    late = next(era for era in selection["mission_eras"] if era["id"] == "ERA_DSCOVR_ACE_WIND_LATE_2025_2026")\n'
              + '    assert late["stop_utc"] == "2026-07-01T00:00:00Z"\n'
          )
          if text.count(marker) != 1:
              raise SystemExit("could not locate unique selection-contract test marker")
          test_path.write_text(text.replace(marker, additions), encoding="utf-8")
          print("Catalog coverage bounded without changing detector or clustering fields")
          PY

      - name: Install dependencies and run focused invariants
        run: |
          python -m pip install -r requirements.txt lxml==6.0.1
          python -m json.tool config/gannon_holdout_v2_selection.v1.json >/dev/null
          python -m compileall -q \
            historical/select_gannon_v2_holdout_registry.py \
            tests/test_gannon_v2_holdout_registry_selection.py
          python -m pytest -q tests/test_gannon_v2_holdout_registry_selection.py

      - name: Commit catalog coverage bound and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NVCPP Registry Repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/repair_gannon_v2_catalog_coverage.yml
          git add \
            config/gannon_holdout_v2_selection.v1.json \
            tests/test_gannon_v2_holdout_registry_selection.py
          git commit -m "science: bound V2 selection to independent catalog coverage"
          git push origin HEAD:feature/gannon-v2-holdout-registry
