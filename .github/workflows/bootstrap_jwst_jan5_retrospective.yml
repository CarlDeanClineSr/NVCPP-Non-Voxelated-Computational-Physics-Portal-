name: One-time JWST Jan-5 audit bootstrap

on:
  push:
    branches:
      - audit/jwst-jan5-retrospective-v1
    paths:
      - ".github/workflows/bootstrap_jwst_jan5_retrospective.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message || '', '[jwst-jan5-bootstrap-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/jwst-jan5-retrospective-v1
          fetch-depth: 0

      - name: Materialize reviewed acquisition files
        shell: bash
        run: |
          mkdir -p experiments/jwst_jan5_retrospective
          mkdir -p .github/workflows

          cat > /tmp/acquire.py.gz.b64 <<'ACQUIRE_B64'

ACQUIRE_B64
          base64 --decode /tmp/acquire.py.gz.b64 | gzip --decompress > experiments/jwst_jan5_retrospective/acquire.py
          chmod 0644 experiments/jwst_jan5_retrospective/acquire.py

          cat > /tmp/workflow.yml.gz.b64 <<'WORKFLOW_B64'

WORKFLOW_B64
          base64 --decode /tmp/workflow.yml.gz.b64 | gzip --decompress > .github/workflows/jwst_jan5_retrospective.yml

          python -m py_compile experiments/jwst_jan5_retrospective/acquire.py
          rm -f .github/workflows/bootstrap_jwst_jan5_retrospective.yml

      - name: Commit transparent acquisition implementation
        shell: bash
        run: |
          git config user.name "Carl Dean Cline Sr"
          git config user.email "CARLDCLINE@GMAIL.COM"
          git add -A
          git commit -m "Add evidence-only JWST Jan-5 acquisition [jwst-jan5-bootstrap-complete]"
          git push origin audit/jwst-jan5-retrospective-v1
