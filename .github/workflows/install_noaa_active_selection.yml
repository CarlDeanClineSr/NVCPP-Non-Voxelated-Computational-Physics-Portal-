name: Install NOAA active-source selection repair

on:
  push:
    branches:
      - repair/noaa-active-source-selection-v1
    paths:
      - ".github/workflows/install_noaa_active_selection.yml"
      - ".github/scripts/apply_noaa_active_selection.py"

permissions:
  contents: write

concurrency:
  group: install-noaa-active-source-selection-v1
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/noaa-active-source-selection-v1
          fetch-depth: 0

      - name: Apply exact audited source patch
        run: python .github/scripts/apply_noaa_active_selection.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile, validate, and test
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q core historical observatory pipelines sources tests
          python -m sources.solar1.validate_contract config/solar1_mag_contract.v1.json
          python -m pytest -q

      - name: Commit tested source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NVCPP Audit Installer"
          git config user.email "actions@users.noreply.github.com"
          git add sources/noaa_swpc/download_realtime.py tests/test_noaa_realtime.py
          git commit -m "repair: select NOAA provider-designated active upstream rows"
          git push origin HEAD:repair/noaa-active-source-selection-v1
