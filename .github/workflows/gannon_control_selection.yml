name: NVCPP Gannon Independent Control Selection

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gannon-control-calibration-v1
    paths:
      - "historical/select_gannon_control_intervals.py"
      - "tests/test_gannon_control_selection.py"
      - ".github/workflows/gannon_control_selection.yml"

permissions:
  contents: read

concurrency:
  group: nvcpp-gannon-control-selection
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and run focused tests
        run: |
          python -m compileall -q \
            historical/select_gannon_control_intervals.py \
            tests/test_gannon_control_selection.py
          python -m pytest -q tests/test_gannon_control_selection.py
      - name: Select controls without reading MAG gate data
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          python -m historical.select_gannon_control_intervals \
            --outdir runs/audits/gannon_control_selection
      - name: Verify the selection firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("runs/audits/gannon_control_selection")
          registry = json.loads((root / "proposed_control_registry.json").read_text())
          manifest = json.loads((root / "control_selection_manifest.json").read_text())
          firewall = registry["selection_firewall"]
          if manifest.get("status") != "SUCCESS":
              raise SystemExit("selection did not succeed")
          if manifest.get("magnetic_data_accessed") is not False:
              raise SystemExit("selector accessed magnetic data")
          if manifest.get("physics_computed") is not False:
              raise SystemExit("selector computed physics")
          if any(
              firewall.get(key) is not False
              for key in (
                  "magnetic_data_accessed",
                  "gate_thresholds_accessed",
                  "gate_results_accessed",
              )
          ):
              raise SystemExit("selection firewall was violated")
          classes = [item["control_class"] for item in registry["controls"]]
          if classes.count("QUIET_KP_SELECTED") != 3:
              raise SystemExit("quiet selection count is not three")
          if classes.count("MODERATE_KP_SELECTED") != 3:
              raise SystemExit("moderate selection count is not three")
          if classes.count("ISOLATED_DONKI_IPS_SELECTED") != 3:
              raise SystemExit("isolated IPS selection count is not three")
          print(json.dumps(registry["controls"], indent=2))
          PY
      - name: Upload immutable selection proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvcpp-gannon-control-selection
          path: runs/audits/gannon_control_selection
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
