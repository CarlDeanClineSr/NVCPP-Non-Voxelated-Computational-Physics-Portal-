name: NVCPP L1 MAG Coherence Audit (DSCOVR ↔ SOLAR-1)

on:
  workflow_dispatch:
    inputs:
      start_time:
        description: Retrieval start UTC, including pre-roll
        default: "2026-06-01T00:00:00.000Z"
        required: true
      analysis_start:
        description: Analysis start UTC
        default: "2026-06-02T00:00:00.000Z"
        required: true
      end_time:
        description: Exclusive end UTC
        default: "2026-06-05T00:00:00.000Z"
        required: true
  push:
    branches: [main]
    paths:
      - "core/cline_l1_chain_v1.py"
      - "core/temporal_pairing.py"
      - "historical/download_dscovr_cdaweb.py"
      - "sources/solar1/download_solar1.py"
      - "sources/solar1/validate_contract.py"
      - "config/solar1_mag_contract.v1.json"
      - "requirements.txt"
      - ".github/workflows/l1_temporal_pairing.yml"

permissions:
  contents: read

jobs:
  coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Build SOLAR-1 canonical one-minute table
        run: |
          python -m sources.solar1.download_solar1 \
            --run solar1_overlap \
            --start "${{ inputs.start_time || '2026-06-01T00:00:00.000Z' }}" \
            --analysis-start "${{ inputs.analysis_start || '2026-06-02T00:00:00.000Z' }}" \
            --end "${{ inputs.end_time || '2026-06-05T00:00:00.000Z' }}" \
            --outdir runs/historical
      - name: Build DSCOVR canonical one-minute table
        run: |
          python -m historical.download_dscovr_cdaweb \
            --run dscovr_overlap \
            --start "${{ inputs.start_time || '2026-06-01T00:00:00.000Z' }}" \
            --analysis-start "${{ inputs.analysis_start || '2026-06-02T00:00:00.000Z' }}" \
            --end "${{ inputs.end_time || '2026-06-05T00:00:00.000Z' }}" \
            --outdir runs/historical
      - name: Execute exact-overlap coherence audit
        run: |
          python -m core.temporal_pairing \
            --dscovr runs/historical/dscovr_overlap/cline_l1_rows.csv \
            --solar1 runs/historical/solar1_overlap/solar1_cline_l1_rows.csv \
            --dscovr-manifest runs/historical/dscovr_overlap/dscovr_run_manifest.json \
            --solar1-manifest runs/historical/solar1_overlap/solar1_run_manifest.json \
            --outdir runs/pairing \
            --bootstrap-iterations 300 \
            --null-iterations 300
      - name: Preserve complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-mag-coherence-audit-${{ github.run_id }}-${{ github.sha }}
          path: |
            runs/pairing/
            runs/historical/solar1_overlap/solar1_run_manifest.json
            runs/historical/solar1_overlap/solar1_quarantine.csv
            runs/historical/dscovr_overlap/dscovr_run_manifest.json
            runs/historical/dscovr_overlap/dscovr_quarantine.csv
          if-no-files-found: warn
          retention-days: 90
