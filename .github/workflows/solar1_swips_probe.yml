name: NVCPP SOLAR-1 SWiPS Discovery Probe

on:
  push:
    paths:
      - 'sources/solar1/download_swips_discovery.py'
      - '.github/workflows/solar1_swips_probe.yml'
  workflow_dispatch:

jobs:
  probe-solar1-swips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run SWiPS Discovery Probe
        run: |
          python -m sources.solar1.download_swips_discovery --outdir runs/solar1/swips_probe

      - name: Archive Discovery Manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar1-swips-discovery-${{ github.run_id }}
          path: runs/solar1/swips_probe/
