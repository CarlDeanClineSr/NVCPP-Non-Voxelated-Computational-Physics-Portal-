name: NVCPP SOLAR-1 SWiPS SPOT/HAPI Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/solar1/download_swips_discovery.py"
      - "requirements.txt"
      - ".github/workflows/solar1_swips_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m sources.solar1.download_swips_discovery --outdir runs/solar1/swips_probe
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar1-swips-hapi-discovery-${{ github.run_id }}
          path: runs/solar1/swips_probe/
          if-no-files-found: error
          retention-days: 90
