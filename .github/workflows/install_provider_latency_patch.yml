name: Install verified provider-latency repair

on:
  push:
    branches:
      - repair/hourly-provider-latency-v1
    paths:
      - ".github/workflows/install_provider_latency_patch.yml"
      - ".provider_latency_patch_v2/**"

permissions:
  contents: write

concurrency:
  group: install-provider-latency-v1
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/hourly-provider-latency-v1
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .provider_latency_patch_v2/part_*.txt | base64 --decode > /tmp/provider_latency_patch.zip
          echo "5ca8c89b94b3115db6aadfd540be39e4bd9342839dfab736f00467ad376ee7f4  /tmp/provider_latency_patch.zip" | sha256sum --check --strict

      - name: Extract only audited files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          expected = {
              "sources/noaa_swpc/download_realtime.py",
              "observatory/run_hourly.py",
              "tests/test_noaa_realtime.py",
              "tests/test_hourly_orchestrator.py",
          }
          root = Path.cwd().resolve()
          with zipfile.ZipFile("/tmp/provider_latency_patch.zip") as archive:
              names = set(archive.namelist())
              if names != expected:
                  raise SystemExit(
                      f"patch inventory mismatch; missing={sorted(expected-names)}, "
                      f"unexpected={sorted(names-expected)}"
                  )
              for name in sorted(names):
                  target = (root / name).resolve()
                  if root not in target.parents:
                      raise SystemExit(f"unsafe archive path: {name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          print(f"Installed {len(expected)} audited files")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile, validate, and test
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q core historical observatory pipelines sources tests
          python -m sources.solar1.validate_contract config/solar1_mag_contract.v1.json
          python -m pytest -q

      - name: Commit tested source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NVCPP Audit Installer"
          git config user.email "actions@users.noreply.github.com"
          git add sources/noaa_swpc/download_realtime.py observatory/run_hourly.py \
            tests/test_noaa_realtime.py tests/test_hourly_orchestrator.py
          git commit -m "repair: preserve latest provider window and latency state"
          git push origin HEAD:repair/hourly-provider-latency-v1
