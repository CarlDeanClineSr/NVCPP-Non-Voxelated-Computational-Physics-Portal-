name: Repair control-selector HAPI ordering

on:
  push:
    branches:
      - feature/gate-control-harness-v1
    paths:
      - ".github/workflows/repair_control_selector_transport.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gate-control-harness-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply schema-order edit only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("historical/select_mag_gate_control_intervals.py"): (
                  '["F", "flow_speed", "SYM_H", "percent_interp"]',
                  '["percent_interp", "F", "flow_speed", "SYM_H"]',
              ),
              Path("tests/test_mag_gate_control_selection.py"): (
                  '["F", "flow_speed", "SYM_H", "percent_interp"]',
                  '["percent_interp", "F", "flow_speed", "SYM_H"]',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one frozen-order occurrence")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install and validate
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q historical/select_mag_gate_control_intervals.py tests/test_mag_gate_control_selection.py
          python -m json.tool config/mag_gate_control_selection.v1.json >/dev/null
          python -m pytest -q tests/test_mag_gate_control_selection.py
      - name: Commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NVCPP Audit Installer"
          git config user.email "actions@users.noreply.github.com"
          git add historical/select_mag_gate_control_intervals.py tests/test_mag_gate_control_selection.py
          git commit -m "fix: honor OMNI HAPI parameter order"
          git push origin HEAD:feature/gate-control-harness-v1
