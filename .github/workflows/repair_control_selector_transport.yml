name: Repair control-selector HAPI ordering

on:
  push:
    branches:
      - feature/gate-control-harness-v1
    paths:
      - ".github/workflows/repair_control_selector_transport.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gate-control-harness-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply exact transport-only edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("historical/select_mag_gate_control_intervals.py")
          text = source.read_text(encoding="utf-8")
          old_order = '["F", "flow_speed", "SYM_H", "percent_interp"]'
          new_order = '["percent_interp", "F", "flow_speed", "SYM_H"]'
          if text.count(old_order) != 1:
              raise SystemExit("selector frozen-order edit did not match exactly once")
          text = text.replace(old_order, new_order)

          old_parse = '''        raw = response.content
          path = outdir / f"omni_chunk_{index:02d}.csv"
          path.write_bytes(raw)
          frame = parse_chunk(
          '''
          new_parse = '''        raw = response.content
          path = outdir / f"omni_chunk_{index:02d}.csv"
          path.write_bytes(raw)
          stripped = raw.lstrip()
          if stripped.startswith(b"{"):
              try:
                  payload = response.json()
              except ValueError as exc:
                  raise ControlSelectionError(
                      "OMNI HAPI data returned malformed JSON"
                  ) from exc
              status = payload.get("status", {})
              if status.get("code") != 1200:
                  raise ControlSelectionError(
                      f"OMNI HAPI data status is not 1200: {status}"
                  )
          frame = parse_chunk(
          '''
          if text.count(old_parse) != 1:
              raise SystemExit("selector HAPI-status edit did not match exactly once")
          source.write_text(text.replace(old_parse, new_parse), encoding="utf-8")

          test = Path("tests/test_mag_gate_control_selection.py")
          test_text = test.read_text(encoding="utf-8")
          old_test = '["F", "flow_speed", "SYM_H", "percent_interp"]'
          new_test = '["percent_interp", "F", "flow_speed", "SYM_H"]'
          if test_text.count(old_test) != 1:
              raise SystemExit("selector test-order edit did not match exactly once")
          test.write_text(test_text.replace(old_test, new_test), encoding="utf-8")
          PY
      - name: Install and validate
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q historical/select_mag_gate_control_intervals.py tests/test_mag_gate_control_selection.py
          python -m json.tool config/mag_gate_control_selection.v1.json >/dev/null
          python -m pytest -q tests/test_mag_gate_control_selection.py
      - name: Commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NVCPP Audit Installer"
          git config user.email "actions@users.noreply.github.com"
          git add historical/select_mag_gate_control_intervals.py tests/test_mag_gate_control_selection.py
          git commit -m "fix: honor OMNI HAPI parameter order and status"
          git push origin HEAD:feature/gate-control-harness-v1
