name: NVCPP SOLAR-1 MAG Historical Regression

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: Run identifier
        required: true
        default: solar1_regression_june_2026
      start_time:
        description: Retrieval start UTC, including pre-roll
        required: true
        default: "2026-06-01T00:00:00.000Z"
      analysis_start:
        description: Analysis start UTC
        required: true
        default: "2026-06-02T00:00:00.000Z"
      end_time:
        description: Exclusive end UTC
        required: true
        default: "2026-06-05T00:00:00.000Z"
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - "core/cline_l1_chain_v1.py"
      - "sources/solar1/download_solar1.py"
      - "sources/solar1/validate_contract.py"
      - "sources/solar1/mission_phase.py"
      - "config/solar1_mag_contract.v1.json"
      - "requirements.txt"
      - ".github/workflows/solar1_run.yml"

permissions:
  contents: read

concurrency:
  group: solar1-mag-regression
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute audited SOLAR-1 MAG regression
        run: |
          python -m sources.solar1.download_solar1 \
            --run "${{ inputs.run_name || 'solar1_regression_june_2026' }}" \
            --start "${{ inputs.start_time || '2026-06-01T00:00:00.000Z' }}" \
            --analysis-start "${{ inputs.analysis_start || '2026-06-02T00:00:00.000Z' }}" \
            --end "${{ inputs.end_time || '2026-06-05T00:00:00.000Z' }}" \
            --outdir runs/historical
      - name: Label the run by declared SOLAR-1 mission phase
        if: always()
        shell: bash
        run: |
          RUN_NAME="${{ inputs.run_name || 'solar1_regression_june_2026' }}"
          RUN_DIR="runs/historical/${RUN_NAME}"
          MANIFEST="${RUN_DIR}/solar1_run_manifest.json"
          REPORT="${RUN_DIR}/solar1_cline_l1_report.md"
          if [[ -f "$MANIFEST" ]]; then
            if [[ -f "$REPORT" ]]; then
              python -m sources.solar1.mission_phase \
                --manifest "$MANIFEST" \
                --report "$REPORT"
            else
              python -m sources.solar1.mission_phase \
                --manifest "$MANIFEST"
            fi
          else
            echo "No SOLAR-1 manifest exists to phase-label."
          fi
      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar1-mag-regression-${{ github.run_id }}-${{ github.sha }}
          path: runs/historical/
          if-no-files-found: error
          retention-days: 90
