name: NVCPP SOLAR-1 SWiPS Archive Discovery V2

on:
  push:
    paths:
      - 'sources/solar1/swips_archive_discovery_v2.py'
      - '.github/workflows/solar1_swips_archive_v2.yml'
  workflow_dispatch:

jobs:
  swips-archive-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run SWiPS Archive Discovery V2
        run: |
          python -m sources.solar1.swips_archive_discovery_v2 --outdir runs/solar1/swips_archive_v2

      - name: Archive V2 Discovery Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar1-swips-archive-v2-${{ github.run_id }}
          path: runs/solar1/swips_archive_v2/
