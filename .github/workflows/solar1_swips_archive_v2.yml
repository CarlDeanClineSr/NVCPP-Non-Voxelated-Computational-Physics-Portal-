name: NVCPP SOLAR-1 SWiPS Archive Discovery V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/solar1/swips_archive_discovery_v2.py"
      - "requirements.txt"
      - ".github/workflows/solar1_swips_archive_v2.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m sources.solar1.swips_archive_discovery_v2 --outdir runs/solar1/swips_archive_v2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar1-swips-archive-v2-${{ github.run_id }}
          path: runs/solar1/swips_archive_v2/
          if-no-files-found: error
          retention-days: 90
