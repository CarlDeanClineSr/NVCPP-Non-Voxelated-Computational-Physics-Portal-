name: NVCPP DSCOVR Historical Run

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: Run identifier
        required: true
        default: dscovr_gannon_may_2024
      start_time:
        description: Retrieval start UTC, including pre-roll
        required: true
        default: "2024-05-09T00:00:00.000Z"
      analysis_start:
        description: Analysis start UTC
        required: true
        default: "2024-05-10T00:00:00.000Z"
      end_time:
        description: Exclusive end UTC
        required: true
        default: "2024-05-13T00:00:00.000Z"
  push:
    branches: [main]
    paths:
      - "core/cline_l1_chain_v1.py"
      - "historical/download_dscovr_cdaweb.py"
      - "requirements.txt"
      - ".github/workflows/dscovr_historical.yml"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute audited DSCOVR one-minute pipeline
        run: |
          python -m historical.download_dscovr_cdaweb \
            --run "${{ inputs.run_name || 'dscovr_gannon_may_2024' }}" \
            --start "${{ inputs.start_time || '2024-05-09T00:00:00.000Z' }}" \
            --analysis-start "${{ inputs.analysis_start || '2024-05-10T00:00:00.000Z' }}" \
            --end "${{ inputs.end_time || '2024-05-13T00:00:00.000Z' }}" \
            --outdir runs/historical
      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dscovr-historical-${{ github.run_id }}-${{ github.sha }}
          path: runs/historical/
          if-no-files-found: error
          retention-days: 90
