name: NVCPP DSCOVR Historical Run

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: "Historical run target (e.g. gannon_may_2024_dscovr_mag_only)"
        required: true
        default: "gannon_may_2024_dscovr_mag_only"

jobs:
  run-historical:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests PyYAML matplotlib

      - name: Execute Historical Pipeline
        run: |
          python -m pipelines.run_pipeline dscovr-historical \
            --run "${{ github.event.inputs.run_name }}" \
            --outdir runs/historical

      - name: Upload Scientific Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dscovr-historical-artifacts
          path: runs/historical/
          if-no-files-found: error
