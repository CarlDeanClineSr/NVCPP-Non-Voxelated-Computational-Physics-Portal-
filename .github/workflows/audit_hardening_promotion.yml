name: NVCPP Audit Hardening Promotion Gate

on:
  push:
    branches: [audit-hardening-v2]
    paths:
      - ".github/workflows/audit_hardening_promotion.yml"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: nvcpp-audit-hardening-promotion
  cancel-in-progress: true

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tests: ${{ steps.summary.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q core historical pipelines sources tests
      - run: python -m sources.solar1.validate_contract config/solar1_mag_contract.v1.json
      - run: python -m pytest -q
      - id: summary
        run: echo "tests=PASS" >> "$GITHUB_OUTPUT"

  mag-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      interpretation: ${{ steps.summary.outputs.interpretation }}
      exact_rows: ${{ steps.summary.outputs.exact_rows }}
      best_r: ${{ steps.summary.outputs.best_r }}
      zero_r: ${{ steps.summary.outputs.zero_r }}
      lag: ${{ steps.summary.outputs.lag }}
      p_value: ${{ steps.summary.outputs.p_value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify current SOLAR-1 metadata against the frozen contract
        run: python -m sources.solar1.download_ncei --outdir runs/solar1/metadata
      - name: Build SOLAR-1 canonical one-minute product
        run: |
          python -m sources.solar1.download_solar1 \
            --run solar1_overlap \
            --start 2026-06-01T00:00:00.000Z \
            --analysis-start 2026-06-02T00:00:00.000Z \
            --end 2026-06-05T00:00:00.000Z \
            --outdir runs/historical
      - name: Build DSCOVR canonical one-minute product
        run: |
          python -m historical.download_dscovr_cdaweb \
            --run dscovr_overlap \
            --start 2026-06-01T00:00:00.000Z \
            --analysis-start 2026-06-02T00:00:00.000Z \
            --end 2026-06-05T00:00:00.000Z \
            --outdir runs/historical
      - name: Run exact-overlap coherence audit
        run: |
          python -m core.temporal_pairing \
            --dscovr runs/historical/dscovr_overlap/cline_l1_rows.csv \
            --solar1 runs/historical/solar1_overlap/solar1_cline_l1_rows.csv \
            --dscovr-manifest runs/historical/dscovr_overlap/dscovr_run_manifest.json \
            --solar1-manifest runs/historical/solar1_overlap/solar1_run_manifest.json \
            --outdir runs/pairing \
            --bootstrap-iterations 300 \
            --null-iterations 300
      - id: summary
        name: Validate and expose the scientific classification
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("runs/pairing/pairing_manifest.json").read_text())
          allowed = {
              "NO_STABLE_COHERENCE",
              "COHERENT_BUT_LAG_UNRESOLVED",
              "LAG_CANDIDATE_REQUIRES_EPHEMERIS",
          }
          interpretation = manifest["interpretation"]
          if interpretation not in allowed:
              raise SystemExit(f"unexpected interpretation: {interpretation}")
          overlap = int(manifest["overlap"]["exact_rows"])
          if overlap < 1000:
              raise SystemExit(f"insufficient exact overlap: {overlap}")
          metrics = manifest["metrics"]
          if metrics["look_elsewhere_p_value"] is None:
              raise SystemExit("look-elsewhere p-value was not computed")
          print(f"interpretation={interpretation}")
          print(f"exact_rows={overlap}")
          print(f"best_r={metrics['best_fit_pearson_r']}")
          print(f"zero_r={metrics['zero_lag_pearson_r']}")
          print(f"lag={metrics['best_fit_lag_minutes']}")
          print(f"p_value={metrics['look_elsewhere_p_value']}")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-hardening-mag-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
          retention-days: 90

  swips-hapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      state: ${{ steps.summary.outputs.state }}
      found: ${{ steps.summary.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m sources.solar1.download_swips_discovery --outdir runs/solar1/swips_probe
      - id: summary
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("runs/solar1/swips_probe/solar1_swips_discovery_manifest.json")
          data = json.loads(path.read_text())
          if data["science_computation_enabled"] is not False:
              raise SystemExit("SWiPS science was enabled during discovery")
          print(f"state={data['discovery_state']}")
          print(f"found={str(data['dataset_found']).lower()}")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-hardening-swips-hapi-${{ github.run_id }}
          path: runs/solar1/swips_probe/
          if-no-files-found: warn
          retention-days: 90

  swips-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      state: ${{ steps.summary.outputs.state }}
      objects: ${{ steps.summary.outputs.objects }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m sources.solar1.swips_archive_discovery_v2 --outdir runs/solar1/swips_archive_v2
      - id: summary
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("runs/solar1/swips_archive_v2/swips_archive_discovery_v2_manifest.json")
          data = json.loads(path.read_text())
          print(f"state={data['discovery_state']}")
          print(f"objects={data['matching_swips_object_count']}")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-hardening-swips-archive-${{ github.run_id }}
          path: runs/solar1/swips_archive_v2/
          if-no-files-found: warn
          retention-days: 90

  promote:
    needs: [static-audit, mag-coherence, swips-hapi, swips-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-hardening-v2
          fetch-depth: 0
      - name: Record live validation evidence
        env:
          INTERPRETATION: ${{ needs.mag-coherence.outputs.interpretation }}
          EXACT_ROWS: ${{ needs.mag-coherence.outputs.exact_rows }}
          BEST_R: ${{ needs.mag-coherence.outputs.best_r }}
          ZERO_R: ${{ needs.mag-coherence.outputs.zero_r }}
          BEST_LAG: ${{ needs.mag-coherence.outputs.lag }}
          P_VALUE: ${{ needs.mag-coherence.outputs.p_value }}
          SWIPS_HAPI_STATE: ${{ needs.swips-hapi.outputs.state }}
          SWIPS_HAPI_FOUND: ${{ needs.swips-hapi.outputs.found }}
          SWIPS_ARCHIVE_STATE: ${{ needs.swips-archive.outputs.state }}
          SWIPS_ARCHIVE_OBJECTS: ${{ needs.swips-archive.outputs.objects }}
        run: |
          cat > docs/LIVE_VALIDATION_2026-08-26.md <<EOF
          # NVCPP Live Validation — 2026-08-26

          - Source branch SHA: \`${GITHUB_SHA}\`
          - GitHub Actions run: \`${GITHUB_RUN_ID}\`
          - Offline compile/contract/tests: **PASS**
          - Exact MAG overlap rows: **${EXACT_ROWS}**
          - MAG interpretation: **${INTERPRETATION}**
          - Best-fit Pearson r: **${BEST_R}**
          - Zero-lag Pearson r: **${ZERO_R}**
          - Data-selected best lag: **${BEST_LAG} minutes**
          - Lag-search look-elsewhere p-value: **${P_VALUE}**
          - SWiPS SPOT/HAPI state: **${SWIPS_HAPI_STATE}**
          - SWiPS dataset found in SPOT/HAPI: **${SWIPS_HAPI_FOUND}**
          - SWiPS archive state: **${SWIPS_ARCHIVE_STATE}**
          - Matching SWiPS archive objects: **${SWIPS_ARCHIVE_OBJECTS}**

          The MAG result is classified by the program without propagation-proof language.
          SWiPS remains discovery-only; no plasma computation was enabled.
          EOF
      - name: Remove temporary branch-only validation workflows
        run: |
          git rm .github/workflows/audit_hardening_network_validation.yml
          git rm .github/workflows/audit_hardening_promotion.yml
      - name: Commit validated evidence to the pull request branch
        run: |
          git config user.name "NVCPP Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/LIVE_VALIDATION_2026-08-26.md
          git commit -m "audit: record successful live validation"
          git push origin HEAD:audit-hardening-v2
      - name: Squash-merge the validated audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge 2 \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --subject "Audit hardening v2: canonical inputs and honest inference"
