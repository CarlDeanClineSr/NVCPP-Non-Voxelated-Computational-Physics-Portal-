name: Patch Gannon V2 source-magnitude provenance v2

on:
  push:
    branches:
      - hardening/gannon-v2-source-magnitude-provenance
    paths:
      - ".github/workflows/patch_gannon_v2_magnitude_provenance_v2.yml"

permissions:
  contents: write

concurrency:
  group: patch-gannon-v2-magnitude-provenance-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/gannon-v2-source-magnitude-provenance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Add explicit nonhomologous source provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("historical/gannon_holdout_v2_consumer.py")
          text = path.read_text(encoding="utf-8")
          original = text
          text = text.replace(
              'CONSUMER_VERSION = "1.0.0"',
              'CONSUMER_VERSION = "1.0.1"',
              1,
          )

          iso_anchor = '''def _iso(value: pd.Timestamp) -> str:
              return value.isoformat().replace("+00:00", "Z")


          def _slice_analysis'''.replace("          ", "")
          helper = '''def _iso(value: pd.Timestamp) -> str:
              return value.isoformat().replace("+00:00", "Z")


          def canonical_magnitude_provenance(mission: str) -> dict[str, Any]:
              """Describe exactly how canonical |B| is constructed for one source."""

              records: dict[str, dict[str, Any]] = {
                  "DSCOVR": {
                      "dataset_id": "DSCOVR_H0_MAG",
                      "component_source": "B1GSE",
                      "component_columns": [
                          "resolved B1GSE Bx GSE component",
                          "resolved B1GSE By GSE component",
                          "resolved B1GSE Bz GSE component",
                      ],
                      "provider_reported_magnitude_parameter": None,
                      "provider_reported_magnitude_role": "NOT_PRESENT_IN_REQUEST",
                  },
                  "ACE": {
                      "dataset_id": "AC_H0_MFI",
                      "component_source": "BGSEc",
                      "component_columns": ["BGSEc_x", "BGSEc_y", "BGSEc_z"],
                      "provider_reported_magnitude_parameter": "Magnitude",
                      "provider_reported_magnitude_role": "AUDIT_ONLY",
                  },
                  "WIND": {
                      "dataset_id": "WI_H0_MFI",
                      "component_source": "B3GSE",
                      "component_columns": ["B3GSE_x", "B3GSE_y", "B3GSE_z"],
                      "provider_reported_magnitude_parameter": "B3F1",
                      "provider_reported_magnitude_role": "AUDIT_ONLY",
                  },
              }
              if mission not in records:
                  raise HoldoutConsumerError(
                      f"unsupported canonical magnitude provenance mission: {mission}"
                  )
              return {
                  **records[mission],
                  "coordinate_frame": "GSE",
                  "canonical_quantity": "B_mag_nT",
                  "provider_reported_magnitude_used_for_canonical_B": False,
                  "operation_order": [
                      "average native vector components within each canonical UTC minute",
                      "calculate Euclidean norm from the three component means",
                  ],
                  "formula": (
                      "B_mag_nT = sqrt(mean(Bx_GSE)^2 + mean(By_GSE)^2 + "
                      "mean(Bz_GSE)^2)"
                  ),
                  "nonhomologous_source_warning": (
                      "provider scalar magnitude fields are retained only for source audit; "
                      "they are not averaged into or substituted for canonical B_mag_nT"
                  ),
              }


          def _slice_analysis'''.replace("          ", "")
          if iso_anchor not in text:
              raise SystemExit("could not locate _iso helper anchor")
          text = text.replace(iso_anchor, helper, 1)

          def function_block(value: str, name: str, next_name: str) -> tuple[int, int, str]:
              start = value.index(f"def {name}(")
              stop = value.index(f"\ndef {next_name}(", start)
              return start, stop, value[start:stop]

          start, stop, block = function_block(text, "retrieve_dscovr", "retrieve_ace")
          dscovr_anchor = '        "canonicalization": metrics,\n'
          if dscovr_anchor not in block:
              raise SystemExit("could not locate DSCOVR canonicalization metadata")
          block = block.replace(
              dscovr_anchor,
              dscovr_anchor
              + '        "canonical_magnitude_provenance": '\
              + 'canonical_magnitude_provenance("DSCOVR"),\n',
              1,
          )
          text = text[:start] + block + text[stop:]

          def add_return_metadata(value: str, name: str, next_name: str, mission: str) -> str:
              start, stop, block = function_block(value, name, next_name)
              anchor = "    return _slice_analysis(canonical, window), quarantine, metadata\n"
              if anchor not in block:
                  raise SystemExit(f"could not locate return metadata anchor in {name}")
              replacement = (
                  "    metadata = {\n"
                  "        **metadata,\n"
                  f'        "canonical_magnitude_provenance": canonical_magnitude_provenance("{mission}"),\n'
                  "    }\n"
                  + anchor
              )
              block = block.replace(anchor, replacement, 1)
              return value[:start] + block + value[stop:]

          text = add_return_metadata(text, "retrieve_ace", "retrieve_wind", "ACE")
          text = add_return_metadata(text, "retrieve_wind", "minute_arrays", "WIND")

          start, stop, block = function_block(text, "score_interval", "plan_matrix")
          manifest_anchor = '        "source_status": {},\n'
          if manifest_anchor not in block:
              raise SystemExit("could not locate interval manifest source_status anchor")
          manifest_fields = (
              '        "source_products": contract["source_products"],\n'
              '        "canonical_magnitude_provenance": {\n'
              '            mission: canonical_magnitude_provenance(mission)\n'
              '            for mission in ("DSCOVR", "ACE", "WIND")\n'
              '        },\n'
          )
          block = block.replace(manifest_anchor, manifest_fields + manifest_anchor, 1)
          text = text[:start] + block + text[stop:]

          if text == original:
              raise SystemExit("provenance patch produced no source changes")
          path.write_text(text, encoding="utf-8")

          docs_path = Path("docs/GANNON_V2_IMMUTABLE_CONSUMER.md")
          docs = docs_path.read_text(encoding="utf-8")
          if "## Canonical magnitude provenance" not in docs:
              docs += '''

          ## Canonical magnitude provenance

          The three products are not treated as homologous scalar-magnitude
          products. Every interval manifest names the vector used to build
          canonical `B_mag_nT` and the role of any provider scalar magnitude:

          - DSCOVR: average the three `B1GSE` Cartesian components by minute,
            then calculate their Euclidean norm.
          - ACE: average `BGSEc_x`, `BGSEc_y`, and `BGSEc_z` by minute, then
            calculate their Euclidean norm. `Magnitude` is audit-only and never
            enters canonical `B_mag_nT`.
          - Wind: average `B3GSE_x`, `B3GSE_y`, and `B3GSE_z` by minute, then
            calculate their Euclidean norm. `B3F1` is audit-only, is not a vector
            component, and never substitutes for canonical `B_mag_nT`.

          The same provenance is repeated inside each retrieved source metadata
          record. Provider scalar values remain preserved in the raw response but
          do not enter the frozen detector.
          '''.replace("          ", "")
              docs_path.write_text(docs, encoding="utf-8")
          PY

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test provenance boundary
        run: |
          python -m compileall -q historical tests
          python -m pytest -q \
            tests/test_gannon_holdout_v2_consumer.py \
            tests/test_gannon_holdout_v2_source_provenance.py

      - name: Commit provenance-only hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NVCPP Provenance Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add \
            historical/gannon_holdout_v2_consumer.py \
            docs/GANNON_V2_IMMUTABLE_CONSUMER.md
          git commit -m "audit: make ACE and Wind magnitude roles explicit"
          git push origin HEAD:hardening/gannon-v2-source-magnitude-provenance
